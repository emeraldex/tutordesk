name: Bug report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Backend
        - Mobile
        - Docs
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include error messages, logs or screenshots.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Android 14, Pixel 7, app v0.1.0
