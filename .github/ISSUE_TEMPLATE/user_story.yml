name: User story
description: A feature described from a tutor's or parent's point of view
title: "[Story]: "
labels: ["type: story"]
body:
  - type: dropdown
    id: role
    attributes:
      label: Who is this for?
      options:
        - Tutor
        - Parent
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: Story
      description: As a <role>, I want <capability>, so that <benefit>.
      placeholder: As a tutor, I want to see this week's lessons in one list, so that I don't have to check WhatsApp and my calendar separately.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable conditions, ideally Given / When / Then.
      placeholder: |
        - Given I have lessons scheduled this week
          When I open the app
          Then I see them sorted by date and time
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority (MoSCoW)
      options:
        - Must have
        - Should have
        - Could have
        - Won't have (this release)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Mock-ups, edge cases, open questions.
